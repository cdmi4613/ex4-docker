# 워크플로우 이름
name: GitOps CI Pipeline

# main 브랜치에 push되면 GitHub Actions 실행
on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      # GitHub Repository의 파일을 Actions 실행 환경으로 가져오기
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      # ① Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ② Dockerfile을 이용하여 이미지 Build
      # ③ 빌드한 이미지를 Docker Hub에 Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USER }}/nginx:1.31.3-cd

      # GitHub Actions에서 AWS CLI를 사용할 수 있도록 AWS 인증
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ④ SSM을 통해 Private EC2에 Docker 배포 명령 전달
      - name: Private EC2 Docker 컨테이너 배포
        run: |
          aws ssm send-command \
            --instance-ids "i-0ba28a7c5e7470ef2" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"sudo systemctl stop nginx || true\",
              \"sudo docker stop nginx-container || true\",
              \"sudo docker rm nginx-container || true\",
              \"sudo docker pull ${{ secrets.DOCKER_USER }}/nginx:1.31.3-cd\",
              \"sudo docker run -d --name nginx-container -p 80:80 ${{ secrets.DOCKER_USER }}/nginx:1.31.3-cd\"
            ]" \
            --region "${{ secrets.AWS_REGION }}" \
            --comment "Deploying Docker Nginx with SSM"